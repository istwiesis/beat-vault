<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>istwiesis</title>
<script type="importmap">{ "imports": { "three": "./js/vendor/three/build/three.module.min.js", "three/addons/": "./js/vendor/three/examples/jsm/" } }</script>
<style>
  :root {
    --bar-h: 84px; --pad: 32px; --fg: #f1f1f1; --dim: rgba(255,255,255,.5); --line: rgba(255,255,255,.16);
    --display: 'Bahnschrift', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --text: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; scrollbar-width: none; background: #000; }
  html::-webkit-scrollbar { display: none; }
  body { margin: 0; background: #000; color: var(--fg); font: 14px/1.4 var(--text); -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
  button { cursor: pointer; }
  :focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* monochrome grade, vignette and grain are done in the scene's post-processing, not in CSS */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* shared feel: one easing for everything that settles, instant feedback on press */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); --glass: rgba(18,18,18,.5); --edge: rgba(255,255,255,.14); }
  button:active { transform: scale(.96); transition: transform 90ms ease-out; }

  #track section { height: 100vh; height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }

  /* logo images sit on black: screen-blend them straight onto the scene (must be top-level fixed elements) */
  /* contrast crushes the image's near-black background to true black so no box edge shows */
  #brand { position: fixed; z-index: 20; top: 14px; left: var(--pad); width: 150px; mix-blend-mode: screen; filter: grayscale(1) contrast(1.35) brightness(.94); transition: opacity .4s; }
  #brand img, #hero img { display: block; width: 100%; height: auto; }
  #hero { position: fixed; z-index: 5; left: 50%; top: 27%; width: min(640px, 78vw); transform: translate(-50%, -50%); mix-blend-mode: screen; filter: grayscale(1) contrast(1.35) brightness(.94); pointer-events: none; }

  /* hover light on the logo: a brighter copy of the logo, multiplied by a spotlight that follows the pointer, added on top.
     Multiply keeps the light on the letters only (the image is black everywhere else), so no mask is needed. */
  #hero .shine { position: absolute; inset: 0; opacity: 0; isolation: isolate; mix-blend-mode: screen; pointer-events: none; }
  #hero .shine img { filter: brightness(2.3) contrast(1.15); }
  #hero .shine::after { content: ''; position: absolute; inset: 0; mix-blend-mode: multiply; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), #fff 0, #9a9a9a 13%, #000 40%); }

  .tools { position: fixed; z-index: 21; top: 26px; right: var(--pad); display: flex; gap: 22px; font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; transition: opacity .4s; }
  .tools button { color: var(--dim); padding: 4px 0; }
  .tools button:hover { color: #fff; }
  /* car menu: drops out of the tool row */
  #car::after { content: ' ▾'; }
  .cars { position: absolute; top: calc(100% + 10px); right: 0; display: grid; min-width: 190px; padding: 6px; border: 1px solid var(--edge); border-radius: 14px; background: var(--glass); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.5); opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.97); transform-origin: top right; transition: opacity .25s var(--ease), transform .25s var(--ease), visibility 0s .25s; }
  .cars.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .tools .cars button { padding: 9px 12px; border-radius: 9px; text-align: left; white-space: nowrap; letter-spacing: inherit; text-transform: inherit; transition: background .2s, color .2s; }
  .tools .cars button.on { color: #000; background: #fff; }

  .index { position: fixed; z-index: 20; right: var(--pad); top: 50%; transform: translateY(-50%); display: grid; gap: 14px; justify-items: end; transition: opacity .4s; }
  .index button { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .index button::after { content: ''; width: 14px; height: 1px; background: currentColor; transition: width .35s; }
  .index button span { opacity: 0; transform: translateX(6px); transition: opacity .3s, transform .3s; }
  .index button:hover, .index button.on { color: #fff; }
  .index button:hover span, .index button.on span { opacity: 1; transform: none; }
  .index button.on::after { width: 44px; }

  .pane { position: fixed; z-index: 10; inset: 0 0 var(--bar-h) 0; opacity: 0; pointer-events: none; }
  .pane.live > * { pointer-events: auto; }

  /* 00 start */
  .p-start .down { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; font: 10px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
  .p-start .down::after { content: ''; width: 1px; height: 34px; background: linear-gradient(#fff, transparent); animation: drip 1.8s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  .credit { position: absolute; left: var(--pad); bottom: 14px; font: 10px var(--mono); color: rgba(255,255,255,.32); max-width: 46ch; }

  /* 01 beats */
  .p-beats .wrap { position: absolute; left: var(--pad); right: 160px; bottom: 34px; }
  .p-beats .no { font: 11px var(--mono); letter-spacing: .2em; color: var(--dim); }
  .p-beats h2 { margin: 6px 0 10px -.04em; font: 700 clamp(46px, 11vw, 190px)/.86 var(--display); font-stretch: condensed; letter-spacing: -.025em; text-transform: uppercase; overflow-wrap: anywhere; transform-origin: left bottom; text-shadow: 0 2px 30px rgba(0,0,0,.6); transition: opacity .32s var(--ease), transform .32s var(--ease), filter .32s var(--ease); }
  .p-beats h2.out { opacity: 0; transform: translateY(14px); filter: blur(8px); }
  .p-beats .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 26px; font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .p-beats .meta { color: var(--dim); }
  .btn { border: 1px solid var(--edge); border-radius: 999px; padding: 11px 24px; font: 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; background: var(--glass); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); transition: background .2s, color .2s, border-color .2s; }
  .btn:hover { background: #fff; color: #000; border-color: #fff; }
  .step { width: 40px; height: 40px; border: 1px solid var(--edge); border-radius: 50%; font-size: 16px; line-height: 1; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .2s, color .2s; }
  .step:hover { background: #fff; color: #000; }
  .vers { display: flex; gap: 6px; }
  .vers button, .list .v button { border: 1px solid var(--line); padding: 3px 8px; font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .vers button.on, .vers button:hover, .list .v button.on, .list .v button:hover { color: #000; background: #fff; border-color: #fff; }

  /* 02 archive */
  .p-archive .panel { position: absolute; top: 84px; bottom: 22px; right: 150px; width: min(560px, calc(100vw - 2 * var(--pad) - 130px)); display: flex; flex-direction: column; overflow: hidden; background: rgba(10,10,10,.58); border: 1px solid var(--edge); border-radius: 18px; backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 30px 80px rgba(0,0,0,.55); }
  .p-archive .head { display: flex; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  .p-archive input, .p-archive select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: 12px var(--mono); background: rgba(0,0,0,.4); }
  .p-archive input { flex: 1; min-width: 0; }
  .p-archive select option { background: #111; }
  .p-archive .sum { padding: 8px 14px; font: 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
  .list { margin: 0; padding: 0; list-style: none; overflow-y: auto; overscroll-behavior: contain; flex: 1; scrollbar-width: thin; scrollbar-color: #555 transparent; }
  .list li { display: grid; grid-template-columns: 38px 1fr auto 44px 44px; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,.06); font: 12px var(--mono); }
  .list li:hover { background: rgba(255,255,255,.06); }
  .list li.on { background: #fff; color: #000; }
  .list li.on .n, .list li.on .d { color: rgba(0,0,0,.55); }
  .list li.on .v button { border-color: rgba(0,0,0,.3); color: rgba(0,0,0,.6); }
  .list li.on .v button.on { background: #000; color: #fff; border-color: #000; }
  .list .t { text-align: left; padding: 11px 0; font: 600 15px var(--display); letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .n, .list .d { color: var(--dim); }
  .list .b, .list .d { text-align: right; }
  .list .v { display: flex; gap: 4px; }
  .empty { padding: 30px 14px; font: 12px var(--mono); color: var(--dim); }

  /* 03 visual */
  .p-visual p { position: absolute; left: var(--pad); bottom: 26px; margin: 0; font: 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }

  /* player */
  /* floating glass bar: the scene keeps moving underneath it */
  .bar { position: fixed; z-index: 20; left: 14px; right: 14px; bottom: 12px; height: calc(var(--bar-h) - 20px); display: flex; align-items: center; gap: 22px; padding: 0 18px; border-radius: 18px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 50px rgba(0,0,0,.5); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  body.idle .bar { transform: translateY(12px); }
  .bar .ctl { display: flex; align-items: center; gap: 6px; }
  .bar .ctl button { width: 34px; height: 34px; display: grid; place-items: center; opacity: .7; }
  .bar .ctl button:hover { opacity: 1; }
  .bar .ctl .pp { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; opacity: 1; }
  .bar svg { width: 14px; height: 14px; fill: currentColor; }
  .bar .np { min-width: 0; width: 220px; flex: none; }
  .bar .np small { display: block; font: 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .bar .np b { display: block; font: 600 17px var(--display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar canvas { flex: 1; min-width: 0; height: 34px; cursor: pointer; touch-action: none; }
  .bar .time { font: 11px var(--mono); color: var(--dim); white-space: nowrap; min-width: 86px; text-align: right; }
  body.idle .bar, body.idle .index, body.idle .tools, body.idle #brand { opacity: 0; }
  body.idle { cursor: none; }

  /* loader */
  .loader { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; transition: opacity .9s var(--ease); }
  .loader.out { opacity: 0; pointer-events: none; }
  .loader .in { width: min(760px, 88vw); display: grid; justify-items: center; transition: transform .9s var(--ease), filter .9s var(--ease); }
  .loader.out .in { transform: scale(1.08); filter: blur(12px); } /* the logo dissolves towards the viewer as the scene arrives */
  .loader img { width: 100%; height: auto; filter: grayscale(1) contrast(1.35) brightness(.94); animation: rise 1.4s ease-out; }
  @keyframes rise { from { opacity: 0; filter: grayscale(1) contrast(1.35) brightness(.94) blur(8px); } }
  .loader .meter { width: min(320px, 70%); height: 1px; background: var(--line); margin-top: 8px; }
  .loader .meter i { display: block; height: 100%; width: 0; background: #fff; transition: width .3s; }
  .loader .pct { margin-top: 12px; font: 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
  .loader .go { margin-top: 4px; display: grid; justify-items: center; gap: 18px; }
  .loader .snd { font: 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .loader .snd:hover { color: #fff; }

  @media (max-width: 820px) {
    :root { --pad: 16px; --bar-h: 112px; }
    .bar { left: 8px; right: 8px; bottom: 8px; padding: 8px 14px; }
    #brand { width: 110px; top: 12px; }
    .tools { top: 20px; gap: 16px; }
    .index { top: 58px; right: auto; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; }
    .index button::after, .index button span { display: none; }
    .index button.on { border-bottom: 1px solid #fff; }
    .p-beats .wrap { right: var(--pad); bottom: 20px; }
    .p-archive .panel { top: 92px; left: var(--pad); right: var(--pad); width: auto; bottom: 10px; }
    .list li { grid-template-columns: 30px 1fr auto 38px; }
    .list .d { display: none; }
    .credit { right: var(--pad); bottom: 4px; font-size: 9px; text-align: center; max-width: none; }
    .p-start .down { bottom: 40px; }
    .bar { flex-wrap: wrap; gap: 4px 12px; align-content: center; }
    .bar .np { width: auto; flex: 1; }
    .bar canvas { flex: 1 1 100%; order: 5; height: 24px; }
    .bar .time { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .p-start .down::after, .loader img { animation: none; }
    html { scroll-behavior: auto; }
    .loader.out .in, .p-beats h2.out, body.idle .bar { transform: none; filter: none; }
    button:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: #111; }
    .bar, .btn, .step, .cars, .p-archive .panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: #111; }
  }
  @media (prefers-contrast: more) {
    :root { --edge: rgba(255,255,255,.6); --dim: rgba(255,255,255,.8); --glass: #000; }
  }
</style>
</head>
<body class="locked">
<canvas id="stage"></canvas>

<main id="track"><section></section><section></section><section></section><section></section></main>

<button id="brand" aria-label="istwiesis"><img src="img/logo.webp" alt=""></button>
<div id="hero"><img src="img/logo.webp" alt="istwiesis"><div class="shine" aria-hidden="true"><img src="img/logo.webp" alt=""></div></div>
<div class="tools">
  <button id="car" aria-haspopup="listbox" aria-expanded="false" aria-controls="cars"></button>
  <div class="cars" id="cars" role="listbox" aria-label="Auto / Car"></div>
  <button id="lang" aria-label="Sprache / Language">EN</button>
  <button id="mute" aria-pressed="false"></button>
</div>
<nav class="index" id="index" aria-label="Kapitel"></nav>

<section class="pane p-start" data-ch="0">
  <div class="credit" id="credit"></div>
  <div class="down" data-i18n="scroll"></div>
</section>

<section class="pane p-beats" data-ch="1">
  <div class="wrap">
    <div class="no" id="vNo"></div>
    <h2 id="vTitle"></h2>
    <div class="row">
      <button class="step" id="vPrev" aria-label="‹">‹</button>
      <button class="btn" id="vPlay"></button>
      <button class="step" id="vNext" aria-label="›">›</button>
      <span class="meta" id="vMeta"></span>
      <span class="vers" id="vVers"></span>
    </div>
  </div>
</section>

<section class="pane p-archive" data-ch="2">
  <div class="panel">
    <div class="head">
      <input type="search" id="q" autocomplete="off">
      <select id="bpm">
        <option value="" data-i18n="allBpm"></option>
        <option value="0-99">&lt; 100</option><option value="100-119">100–119</option>
        <option value="120-139">120–139</option><option value="140-999">140+</option>
      </select>
    </div>
    <div class="sum" id="sum"></div>
    <ol class="list" id="list"></ol>
  </div>
</section>

<section class="pane p-visual" data-ch="3">
  <p data-i18n="visualHint"></p>
</section>

<footer class="bar" role="region" aria-label="Player">
  <div class="ctl">
    <button id="bPrev" aria-label="prev"><svg viewBox="0 0 14 14"><path d="M1 1h2v12H1zM13 1v12L4 7z"/></svg></button>
    <button id="bPlay" class="pp" aria-label="play"><svg viewBox="0 0 14 14"><path id="ppIcon" d="M3 1l10 6-10 6z"/></svg></button>
    <button id="bNext" aria-label="next"><svg viewBox="0 0 14 14"><path d="M11 1h2v12h-2zM1 1l9 6-9 6z"/></svg></button>
  </div>
  <div class="np"><small data-i18n="nowPlaying"></small><b id="npTitle"></b></div>
  <canvas id="wave" tabindex="0" role="slider" aria-label="Position"></canvas>
  <span class="time" id="time">0:00 / 0:00</span>
</footer>

<div class="loader" id="loader">
  <div class="in">
    <img src="img/logo.webp" alt="istwiesis">
    <div class="meter" id="meter"><i></i></div>
    <div class="pct" id="pct"></div>
    <div class="go" id="go" hidden>
      <button class="btn" id="enter" data-i18n="enter"></button>
      <button class="snd" id="snd" aria-pressed="true"></button>
    </div>
  </div>
</div>

<script type="module">
import { player } from './js/player.js';
import { fmt } from './js/covers.js';

const $ = (id) => document.getElementById(id);
const BEATS = player.beats, N = BEATS.length;
const wrapI = (i) => ((i % N) + N) % N;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => innerWidth < 820;

// ---------- language ----------
const T = {
  de: {
    ch: ['Start', 'Beats', 'Archiv', 'Visual'], scroll: 'Scrollen', enter: 'Eintreten',
    loading: 'Lädt', sndOn: 'Ton an', sndOff: 'Ton aus', nowPlaying: 'Läuft gerade', play: 'Abspielen', pause: 'Pause',
    search: 'Suchen…', allBpm: 'Alle BPM', beats: 'Beats', none: 'Nichts gefunden.',
    visualHint: 'Zurücklehnen · lauter machen', credit: (c) => `3D-Modell: „${c.title}“ von ${c.by}, ${c.lic}, angepasst.`, other: 'EN',
  },
  en: {
    ch: ['Start', 'Beats', 'Archive', 'Visual'], scroll: 'Scroll', enter: 'Enter',
    loading: 'Loading', sndOn: 'Sound on', sndOff: 'Sound off', nowPlaying: 'Now playing', play: 'Play', pause: 'Pause',
    search: 'Search…', allBpm: 'All BPM', beats: 'beats', none: 'Nothing found.',
    visualHint: 'Lean back · turn it up', credit: (c) => `3D model: “${c.title}” by ${c.by}, ${c.lic}, modified.`, other: 'DE',
  },
};
let lang = 'de';
try { lang = localStorage.getItem('iw-lang') || ((navigator.language || 'de').startsWith('de') ? 'de' : 'en'); } catch {}
if (!T[lang]) lang = 'de';
const t = (k) => T[lang][k];

// ---------- state ----------
let view = Math.floor(Math.random() * N); // beat shown in the Beats chapter
let wantSound = true, loadPct = 0, ready = false, chapter = 0;
player.load(view);

// ---------- cars ----------
// Each model is built differently, so its parts are picked by patterns on "/node/…/node/material":
// paint, front/rear lamps (they glow with the bass), wheel (meshes that spin),
// lens (what marks the front, if not `front`), drop (meshes to remove), len (length in metres, default 4.2).
const CARS = [
  { name: 'Dacia 1410', file: 'dacia_1410_sport_tuned.glb', title: 'Dacia 1410 Sport Tuned', by: 'Valentin N (vrntech)', lic: 'CC BY-SA 4.0',
    drop: /\/ground$/, paint: /\/paint$/, lens: /\/lights_f_a$/, front: /\/lights_f(_bulbs|2)?$/, rear: /\/lights_rear_a2$/, wheel: /\/(tire|rim)_/ },
  { name: 'Karmann Ghia', file: 'cars/karmann_ghia.glb', title: 'Karmann Ghia', by: 'AntijnvanderGun', lic: 'CC BY 4.0',
    paint: /\/material$/, front: /\/polySurface(682|712)\//, rear: /\/polySurface(623|691)\//, wheel: /\/Whee$/ },
  { name: 'Mercedes SS', file: 'cars/mercedes_benz_ss_roadster__www.vecarz.com.glb', title: 'Mercedes Benz SS Roadster', by: 'vecarz', lic: 'CC BY-NC-SA 4.0', len: 4.6,
    paint: /\/Paint_black/, front: /\/Lamp\.002$/, rear: /\/Glass_stop/, wheel: /\/(Tires_0|Disc_0|Disc_1_spokes0[5-8])/ }, // the spare (…_10, spokes09) stays still
  { name: 'Suzuki Carry', file: 'cars/suzuki_carry_blind_van.glb', title: 'Suzuki Carry Blind Van', by: 'Dave Love', lic: 'CC BY 4.0', len: 3.4,
    paint: /\/MAINBODY\.007$/, front: /\/focos_front/, rear: /\/rearlight/, wheel: /\/(Tyre|EXT_rim|WatanabeMaterial)/ },
];
let car = 0, carPct = null; // chosen car; load progress of a swap, null when idle
try { car = clamp(parseInt(localStorage.getItem('iw-car')) || 0, 0, CARS.length - 1); } catch {}
$('cars').innerHTML = CARS.map((c, i) => `<button role="option" data-car="${i}">${esc(c.name)}</button>`).join('');
function syncCar() {
  $('car').textContent = CARS[car].name + (carPct === null ? '' : carPct ? ` ${Math.round(carPct)}%` : ' …');
  $('credit').textContent = t('credit')(CARS[car]);
  $('cars').querySelectorAll('button').forEach((b, i) => { b.classList.toggle('on', i === car); b.setAttribute('aria-selected', i === car); });
}
const carMenu = (open) => { $('cars').classList.toggle('open', open); $('car').setAttribute('aria-expanded', open); };
$('car').onclick = () => carMenu(!$('cars').classList.contains('open'));
$('cars').onclick = (e) => {
  const i = e.target.dataset.car;
  if (i === undefined) return;

function drawWave() {
  const dpr = devicePixelRatio || 1, w = wave.clientWidth, h = wave.clientHeight;

  wg.setTransform(dpr, 0, 0, dpr, 0, 0);
  wg.clearRect(0, 0, w, h);
  const peaks = player.version.peaks, n = peaks.length, bw = w / n;
  const prog = scrub ?? (player.duration ? player.time / player.duration : 0);
  for (let i = 0; i < n; i++) {
    const ph = Math.max(1.5, peaks[i] * h * 0.92);
    wg.fillStyle = i / n < prog ? '#fff' : 'rgba(255,255,255,.26)';
    wg.fillRect(i * bw, (h - ph) / 2, Math.max(1, bw - 1.5), ph);

  const hot = new THREE.MeshBasicMaterial({ color: new THREE.Color(7, 7, 7) });
  for (const z of STRIPS) { const m = new THREE.Mesh(new THREE.BoxGeometry(7, 0.05, 0.45), hot); m.position.set(0, 4.2, z); envScene.add(m); }
  for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 9), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.6, 1.6) })); m.position.set(s * 9, 1.6, 0); envScene.add(m); }

    outP.set(...s.p); outT.set(...s.t);
    if (i === 3) { const ang = calm ? 0.6 : time * 0.09 + 0.6; outP.set(Math.sin(ang) * 7.4, 2.5 + Math.sin(time * 0.13) * 0.4, Math.cos(ang) * 7.4); }
    if (s.side && !narrow()) { right.subVectors(outT, outP).setY(0).normalize(); outT.x += -right.z * s.side; outT.z += right.x * s.side; }
  }

  let lastKick = 0, flash = 0, travel = 0, speed = 7, stormAt = 0;
  // a bolt inside the current view, so a strike triggered from the logo is actually seen
  const strikeInView = () => { flash = 1; strike(Math.atan2(camTgt.x - camPos.x, camTgt.z - camPos.z) + (Math.random() - .5) * 0.9); };
  let eBass = 0, eKick = 0, eLevel = 0; // audio envelopes: quick attack, slow release, so nothing snaps
  let susY = 0, susV = 0, lastLx = 0, lv = 0;   // suspension spring and lane drift
  const floorMat = floor.material;
  return {
    swap() { // `car` was changed by the menu
      if (next) dispose(next.box);
      next = null;
      if (car === shown && carBox) { loadId++; leaving = false; carPct = null; syncCar(); return; } // back to the car that is still on screen
      if (!leaving) leaveDir = carZ < -2 ? -1 : 1; // still rolling in: it backs off into the fog it came from
      leaving = !!carBox && !calm;
      loadCar();
    },
    render(dt, time, p) {
      const { bass, kick, level } = player;
      const hv = fx.hover; // pointer on the logo: the storm picks up
      const i = Math.min(2, Math.floor(p)), f = p - i, e = f * f * (3 - 2 * f);
      shot(i, time, pos, tgt); shot(i + 1, time, a, b);
      pos.lerp(a, e); tgt.lerp(b, e);
      eBass += (bass - eBass) * (1 - Math.exp(-dt * (bass > eBass ? 14 : 3.5)));
      eKick += (kick - eKick) * (1 - Math.exp(-dt * (kick > eKick ? 30 : 5)));
      eLevel += (level - eLevel) * (1 - Math.exp(-dt * 2));
      if (!calm) { // handheld camera: slow layered drift of position and aim instead of a rail, plus the pointer
        pos.x += mouse.x * 0.7 + wob(time * 0.31, 1) * 0.16; pos.y += -mouse.y * 0.3 + wob(time * 0.27, 5) * 0.08; pos.z += wob(time * 0.23, 9) * 0.14;
        tgt.x += wob(time * 0.43, 13) * 0.06; tgt.y += wob(time * 0.39, 17) * 0.04;
      }
      const k = calm ? 1 : 1 - Math.pow(0.03, dt);
      camPos.lerp(pos, k); camTgt.lerp(tgt, k);
      camera.position.copy(camPos);
      camera.lookAt(camTgt);
      if (!calm) { camera.rotateZ(wob(time * 0.21, 21) * 0.007); camera.fov = baseFov + eBass * 0.7 - hv * 2.2; camera.updateProjectionMatrix(); }

      // endless drive at a steady cruise; the road scrolls under the standing car
      speed += ((player.playing ? 13 + eLevel * 5 : 7) - speed) * Math.min(1, dt * 0.7);
      if (!calm) travel += speed * dt;
      lane.position.z = -(travel % SPAN);
      floorMat.map.offset.y = -((travel * 48 / 120) % 1);
      floorMat.roughnessMap.offset.y = -((travel * 7 / 120) % 1);
      stencil.position.z = 26 - (travel % 57.6);
      if (!calm) for (const w of wheels) w.o.rotateOnAxis(w.axis, Math.min(speed / w.r, 16) * dt); // capped: a faster turn than ~0.25 rad per frame strobes (spokes seem to jump or run backwards)
      tubes.forEach((m, n) => m.material.color.setScalar(0.42 + eLevel * 0.5 + wob(time * 6 + n, n * 3.1) * 0.03)); // steady lamps with a faint flicker
      under.intensity = eBass * 5;

      if (fx.strike) { fx.strike = false; if (!calm) { strikeInView(); stormAt = 1 + Math.random() * 1.5; } }   // entering the logo: one bolt at once
      if (hv > 0.5 && !calm && (stormAt -= dt) <= 0) { strikeInView(); stormAt = 1.2 + Math.random() * 2.2; }   // staying on it: more follow
      if (kick > 0.95 && lastKick <= 0.95) { susV -= 0.1; if (!calm && Math.random() < 0.1) { flash = 1; strike(); } } // a kick nudges the suspension
      bolt.material.opacity = flash > 0.35 ? flash : 0;
      // lamp glows only face one way: fade them out as the camera moves round, so they never shine through the cabin
      const facing = (camPos.z - rig.position.z) / Math.max(0.001, Math.hypot(camPos.x - rig.position.x, camPos.z - rig.position.z));
      for (const fl of flares) fl.s.material.opacity = fl.base * (0.75 + eBass * 0.5 + hv * 0.7) * clamp((facing * fl.dir - 0.15) / 0.4);
      // the car is always lit from the camera's side: a light on the far side is mirrored by roof, bonnet and wet road straight into the lens
      key.intensity = 50 * clamp((facing + 0.35) / 0.5);
      rim.intensity = 34 * clamp((0.35 - facing) / 0.5);
      bloom.strength = 0.3 + eBass * 0.12 + flash * 0.35 + hv * 0.2;
      grade.uniforms.uTime.value = time % 100; grade.uniforms.uPulse.value = eKick;
      lastKick = kick;
      flash *= Math.pow(0.015, dt);
      sky.intensity = flash * 4;
      scene.background.setScalar(0.001 + flash * 0.02); scene.fog.color.copy(scene.background);
      city.material.opacity = 0.5 + eLevel * 0.2 + flash * 0.3;
      rain.material.opacity = 0.11 + eBass * 0.07 + flash * 0.25 + hv * 0.1;
      if (!calm) {
        const sp = (1 + eBass * 0.35 + hv * 0.6) * dt, len = 0.4 + eBass * 0.15 + hv * 0.25, gust = wob(time * 0.25, 4) * (0.09 + hv * 0.1); // wind comes and goes
        for (let n = 0; n < DROPS; n++) {
          const q = n * 6;
          let y = rp[q + 1] - rs[n] * sp;
          if (y < 0) { y = TOP; rp[q] = camPos.x + (Math.random() - .5) * AREA; rp[q + 2] = camPos.z + (Math.random() - .3) * AREA; }
          rp[q] += gust * dt * 8; rp[q + 2] -= speed * dt * 0.5; // blown sideways by the gusts, swept back by the drive
          rp[q + 1] = y; rp[q + 3] = rp[q] + 0.03 + gust; rp[q + 4] = y - len; rp[q + 5] = rp[q + 2] - len * 0.6;
        }
        rainGeo.attributes.position.needsUpdate = true;
        for (const r of ripples) {
          r.userData.t += dt * 1.5; r.position.z -= speed * dt;
          if (r.userData.t > 1) { r.userData.t = 0; r.position.set(camTgt.x + (Math.random() - .5) * 18, 0.008, camTgt.z + (Math.random() - .5) * 18); }
          const s = 0.6 + r.userData.t * 2.2; r.scale.set(s, s, 1); r.material.opacity = (1 - r.userData.t) * 0.16;
        }
      }
      strips.forEach((m, n) => m.material.color.setScalar((0.5 + eLevel * 0.6 + eKick * 0.45 + hv * 0.5 + wob(time * 5 + n * 2, n) * 0.03) * 1.7)); // above the bloom threshold, so the strips are what glows
      haloMat.opacity = 0.1 + eLevel * 0.14 + eKick * 0.1;
      scene.environmentIntensity = 0.6 + eBass * 0.5 + eKick * 0.15;
      pulse.intensity = eKick * 4;
      for (const g of glow) g.m.emissiveIntensity = g.base + eBass * g.amp;
      for (const h of heads) h.intensity = (15 + eBass * 12) * (1 + hv * 0.8); // full beam while the logo is hovered
      lampMat.opacity = 0.012 + eBass * 0.015;
      if (!calm) {
        // body on a damped spring, shaken by the road surface and nudged by kicks; it leans into its own lane drift
        // soft and well damped (the old stiff spring fed by fast road noise made the whole car, tyres included, tremble)
        const bump = wob(travel * 0.35, 3);
        susV += (-susY * 36 - susV * 11 + bump * 0.12) * dt;
        susY = clamp(susY + susV * dt, -0.03, 0.03);
        const lx = wob(time * 0.17, 2) * 0.32; // lane drift; its speed is smoothed so the lean never twitches with frame timing
        lv += ((lx - lastLx) / Math.max(dt, 0.001) - lv) * (1 - Math.exp(-dt * 5)); lastLx = lx;
        // car swap: the old one pulls away into the fog, the new one rolls in from behind and settles
        // (speed grows with the distance from the bay; before, a car leaving while still behind it, carZ < 0, sped off backwards forever and the next one never came)
        if (leaving) carZ = clamp(carZ + leaveDir * (Math.abs(carZ) * 2.4 + 3) * dt, -60, 60); else carZ *= Math.exp(-dt * 2.2);
        if (next && (!leaving || Math.abs(carZ) > 40)) mount(next);
        if (carBox) carBox.visible = Math.abs(carZ) < 45;
        rig.position.set(lx, susY, carZ);
        rig.rotation.set(susV * 0.02 + wob(time * 0.4, 11) * 0.0015, lv * 0.05, -lv * 0.04 + wob(time * 0.3, 15) * 0.002);

        for (const s of mist) { s.position.z -= speed * dt * 0.35; if (s.position.z < -22) { s.position.z += 44; s.position.x = (Math.random() - .5) * 26; } }
        for (let n = 0; n < SPRAY; n++) {
          const q = n * 3;
          if ((spl[n] -= dt) <= 0) {
            if (!sprayFrom.length) continue;
            const src = sprayFrom[(Math.random() * sprayFrom.length) | 0];
            spp[q] = src.x + (Math.random() - .5) * 0.2; spp[q + 1] = src.y; spp[q + 2] = src.z;
            spv[q] = (Math.random() - .5) * 0.9; spv[q + 1] = 0.3 + Math.random() * 1.3; spv[q + 2] = -(1.2 + Math.random() * 2.6) * (speed / 13);
            spl[n] = 0.2 + Math.random() * 0.5;
          } else {
            spp[q] += spv[q] * dt; spp[q + 1] = Math.max(0.02, spp[q + 1] + spv[q + 1] * dt); spp[q + 2] += spv[q + 2] * dt;
            spv[q + 1] -= 3.2 * dt;
          }
        }
        sprayGeo.attributes.position.needsUpdate = true;
      }

      if (!calm) {
        for (let n = 0; n < DUST; n++) {
          const y = dp[n * 3 + 1] + dv[n] * dt * (1 + level * 3);
          dp[n * 3 + 1] = y > 6 ? 0 : y;
        }
        dustGeo.attributes.position.needsUpdate = true;
        dust.rotation.y = time * 0.01;
      }
      dust.material.opacity = 0.2 + eLevel * 0.2;
      composer.render(dt);
    },
  };
}

// ---------- boot ----------
applyLang();
setTitle();
syncRows();
let gl = null;
buildScene().then((s) => (gl = s)).catch((err) => { console.warn('3D scene unavailable:', err); $('stage').hidden = true; setReady(); });

// ---------- logo hover ----------
const hero = $('hero'), shine = hero.querySelector('.shine');
const hov = { on: false, x: 0.5, y: 0.5, t: 0, rx: 0, ry: 0 };
const hovAt = (e) => {
  const r = hero.getBoundingClientRect();
  hov.x = clamp((e.clientX - r.left) / r.width); hov.y = clamp((e.clientY - r.top) / r.height);
  hero.style.setProperty('--mx', (hov.x * 100).toFixed(1) + '%'); hero.style.setProperty('--my', (hov.y * 100).toFixed(1) + '%');
};
hero.addEventListener('pointerenter', (e) => { hov.on = true; fx.strike = true; hovAt(e); }); // respond on entry, not after a delay
hero.addEventListener('pointermove', hovAt);
hero.addEventListener('pointerleave', () => (hov.on = false));
hero.addEventListener('pointerdown', (e) => { fx.strike = true; hovAt(e); }); // touch has no hover: a tap fires a bolt

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const p = clamp(scrollY / Math.max(1, innerHeight), 0, 3), ch = Math.round(p);
  if (ch !== chapter) {
    chapter = ch;
    $('index').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === ch));
  }
  panes.forEach((el, i) => {
    const o = clamp(1 - Math.abs(p - i) * 2.4);
    el.style.opacity = o; el.classList.toggle('live', o > 0.6);
    if (!calm) el.style.transform = `translateY(${((i - p) * 46).toFixed(1)}px)`; // content travels with the scroll instead of only fading
  });
  const heroO = clamp(1 - p * 2.4);
  hero.style.opacity = heroO;
  hero.style.pointerEvents = heroO > 0.6 && $('loader').hidden ? 'auto' : 'none';
  if (heroO <= 0.6) hov.on = false;
  // logo hover: everything eases from where it currently is, so it can be entered, left and re-entered mid-motion
  hov.t += ((hov.on ? 1 : 0) - hov.t) * (1 - Math.exp(-dt * 9));
  const ease = 1 - Math.exp(-dt * 11);
  hov.rx += (-(hov.y - 0.5) * 9 * hov.t - hov.rx) * ease;
  hov.ry += ((hov.x - 0.5) * 13 * hov.t - hov.ry) * ease;
  fx.hover = hov.t;
  shine.style.opacity = hov.t.toFixed(3);
  hero.style.filter = `grayscale(1) contrast(1.35) brightness(${(0.94 + (calm ? 0 : player.kick * 0.22) + hov.t * 0.1).toFixed(3)})`;
  hero.style.transform = calm ? '' : `translate(-50%, -50%) perspective(900px) rotateX(${hov.rx.toFixed(2)}deg) rotateY(${hov.ry.toFixed(2)}deg) scale(${(1 + hov.t * 0.035).toFixed(4)})`;
  if (!calm) $('vTitle').style.scale = (1 + player.kick * 0.012).toFixed(4); // the beat title breathes with the kick
  const idle = chapter === 3 && player.playing && now > idleAt;
  document.body.classList.toggle('idle', idle);
  $('brand').style.opacity = idle ? 0 : clamp(p * 2.4);
  $('brand').style.pointerEvents = p > 0.4 ? 'auto' : 'none';
  drawWave();
  gl?.render(dt, now / 1000, p);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
