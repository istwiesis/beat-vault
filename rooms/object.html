<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store — Beat Vault</title>
<link rel="stylesheet" href="../css/base.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
  body { background: #1c1d1f; color: #e9e6e0; --pb-accent: #2f3cff; overflow-x: hidden; }
  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .topbar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: min(1520px, calc(100vw - 40px)); height: 56px; z-index: 40;
    background: #232527; border-radius: 4px; display: flex; align-items: center; padding: 0 24px;
  }
  .brand { font: 400 28px 'Inter Tight', sans-serif; letter-spacing: -.03em; text-decoration: none; }
  .brand sup { font-size: 10px; }
  .rn { position: fixed; top: 38px; right: max(44px, calc((100vw - 1520px) / 2 + 24px)); mix-blend-mode: normal; gap: 24px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; z-index: 41; }
  .rn-home { display: none; }
  .rn a { opacity: .85; } .rn a.is-active::after { bottom: -10px; }

  main { position: relative; z-index: 2; width: min(1520px, calc(100vw - 40px)); margin: 0 auto; padding-bottom: calc(var(--pb-h) + 60px); }
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-top: 40px; pointer-events: none; }
  .hero p { font-size: 18px; color: #7d7e80; margin: 0 0 14px; letter-spacing: -.02em; }
  .hero h1 { font: 400 clamp(64px, 8vw, 128px)/.95 'Instrument Serif', Georgia, serif; margin: 0 0 40px; letter-spacing: -.01em; color: #d9d4cb; }
  .hero h1 i { font-style: italic; }
  .btn { pointer-events: auto; align-self: flex-start; background: #1a1ad8; color: #fff; padding: 12px 22px; border-radius: 2px; font-weight: 600; font-size: 15px; text-decoration: none; transition: background .2s; }
  .btn:hover { background: #2f3cff; }
  .scroll { margin-top: 18vh; font: 11px 'Space Mono', monospace; color: #7d7e80; letter-spacing: .2em; }

  .store { background: rgba(28,29,31,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid #333; padding-top: 40px; }
  .store h2 { font: 400 56px 'Instrument Serif', Georgia, serif; margin: 0 0 6px; }
  .store .sub { color: #7d7e80; margin: 0 0 30px; }
  .prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 40px; }
  .prices div { background: #232527; padding: 18px; border-radius: 4px; }
  .prices small { display: block; color: #7d7e80; margin-bottom: 6px; }
  .prices b { font: 400 34px 'Instrument Serif', serif; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 600 11px 'Inter Tight', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #7d7e80; padding: 10px 12px; border-bottom: 1px solid #333; }
  td { padding: 12px; border-bottom: 1px solid #2a2b2d; font-size: 15px; }
  tr.row { cursor: pointer; transition: background .15s; }
  tr.row:hover, tr.row.is-current { background: #232527; }
  td.n, td.b, td.l { font-family: 'Space Mono', monospace; font-size: 12px; color: #9a9a9a; }
  td.t { font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 14px; }
  td.t img { width: 40px; height: 40px; border-radius: 2px; }
  td.v { color: #9a9a9a; font-size: 13px; }
  td.a { text-align: right; white-space: nowrap; }
  td.a a { font-size: 13px; padding: 7px 12px; border-radius: 2px; background: #1a1ad8; color: #fff; text-decoration: none; }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
  tr.is-current.is-playing .eq { display: inline-flex; }
  .eq i { width: 3px; background: #2f3cff; animation: eq .8s infinite ease-in-out; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }
  @media (max-width: 820px) {
    td.v, th.v, td.n, th.n, td.l, th.l { display: none; }
    td { padding: 10px 6px; font-size: 14px; }
    td.t { gap: 10px; } td.t span:not(.eq) { overflow-wrap: anywhere; }
    td.a a { padding: 7px 9px; font-size: 12px; }
    .topbar { top: 12px; width: calc(100vw - 24px); height: 88px; align-items: flex-start; padding: 12px 16px; }
    .rn { top: 62px; left: 28px; right: 28px; justify-content: flex-start; gap: 16px; font-size: 13px; }
    main { width: calc(100vw - 24px); }
    .store h2 { font-size: 42px; }
    .prices { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 28px; }
    .prices div { padding: 12px 10px; } .prices b { font-size: 22px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="topbar"><a class="brand" href="../vault.html" id="brand"></a></div>
<main>
  <section class="hero">
    <p id="lead">Sorry, we couldn't keep these beats to ourselves.</p>
    <h1>Beat <i>Store</i></h1>
    <a class="btn" href="#store">Beats ansehen</a>
    <div class="scroll">↓ SCROLL</div>
  </section>
  <section class="store" id="store">
    <h2>Alle Beats</h2>
    <p class="sub" id="count"></p>
    <div class="prices" id="prices"></div>
    <table>
      <thead><tr><th class="n">#</th><th>Titel</th><th>BPM</th><th class="l">Länge</th><th class="v">Versionen</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { initPlayer } from '../js/player.js';
import { coverURL, fmt } from '../js/covers.js';
import { CONFIG } from '../js/config.js';

const player = initPlayer({ room: 'object' });
const BEATS = player.beats;
const $ = (id) => document.getElementById(id);
$('brand').innerHTML = `${CONFIG.artist[0]}${CONFIG.artist.slice(1).toLowerCase()}<sup>™</sup>`;
$('count').textContent = `${BEATS.length} Beats · Klick auf eine Zeile zum Anhören`;
$('prices').innerHTML = CONFIG.prices.map((p) => `<div><small>${p.name}</small><b>${p.price}</b></div>`).join('');

// ---------- store table ----------
const rows = $('rows');
rows.innerHTML = BEATS.map((b, i) => `
  <tr class="row" data-i="${i}">
    <td class="n">${String(i + 1).padStart(3, '0')}</td>
    <td class="t"><img loading="lazy" alt=""><span>${b.title}</span><span class="eq"><i></i><i></i><i></i></span></td>
    <td class="b">${b.bpm ?? '—'}</td>
    <td class="l">${fmt(b.duration)}</td>
    <td class="v">${b.versions.map((v) => v.label).join(', ')}</td>
    <td class="a"><a href="${player.contactURL(b)}" target="_blank" rel="noopener">Anfragen</a></td>
  </tr>`).join('');
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  e.target.querySelector('img').src = coverURL(BEATS[e.target.dataset.i], 96); io.unobserve(e.target);
}), { rootMargin: '400px' });
rows.querySelectorAll('tr').forEach((tr) => io.observe(tr));
rows.onclick = (e) => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr'); if (!tr) return;
  const i = +tr.dataset.i;
  player.index === i && player.playing ? player.pause() : player.play(i);
};
const mark = () => rows.querySelectorAll('tr').forEach((tr) => {
  tr.classList.toggle('is-current', +tr.dataset.i === player.index);
  tr.classList.toggle('is-playing', player.playing);
});
player.on('change', mark).on('play', mark).on('pause', mark);

// ---------- knit textures ----------
function knit(base, pattern) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  if (pattern) pattern(g, S);
  // stitches: rows of little "V"s
  const cols = 48, rowsN = 40, w = S / cols, h = S / rowsN;
  for (let y = 0; y < rowsN; y++) for (let x = 0; x < cols; x++) {
    const px = x * w + w / 2, py = y * h;
    for (const s of [-1, 1]) {
      const gr = g.createLinearGradient(px, py, px + s * w / 2, py + h);
      gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(1, 'rgba(0,0,0,.35)');
      g.fillStyle = gr;
      g.beginPath(); g.ellipse(px + s * w / 4, py + h / 2, w / 4.2, h / 1.6, s * 0.5, 0, 7); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floral = (g, S) => {
  for (let k = 0; k < 70; k++) {
    const x = Math.random() * S, y = Math.random() * S, r = 10 + Math.random() * 22;
    const hue = [340, 20, 50, 190, 280][k % 5];
    for (let p = 0; p < 6; p++) {
      g.fillStyle = `hsl(${hue} 80% 60%)`;
      g.beginPath(); g.arc(x + Math.cos(p) * r * .6, y + Math.sin(p) * r * .6, r * .45, 0, 7); g.fill();
    }
    g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(x, y, r * .3, 0, 7); g.fill();
  }
};

// ---------- mascot ----------
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth < 820 ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0.6, 14.5);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-4, 6, 6); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const whiteKnit = knit('#e8e6e1'), blueKnit = knit('#2a2fd0'), flowerKnit = knit('#1b2340', floral);
const mat = (map, color = 0xffffff) => new THREE.MeshStandardMaterial({ map, bumpMap: map, bumpScale: 2.5, roughness: 0.95, color, flatShading: true });

const mascot = new THREE.Group();
const head = new THREE.Group();
const skull = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 1), mat(whiteKnit));
skull.scale.set(1, 1.08, 0.95);
head.add(skull);
for (const s of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.1, clearcoat: 1 }));
  eye.position.set(s * 0.55, 0.25, 1.38); eye.scale.z = 0.6; head.add(eye);
  // headphone cups
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.42, 10), mat(flowerKnit));
  cup.rotation.z = Math.PI / 2; cup.position.set(s * 1.8, 0, 0); head.add(cup);
  const pad = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.16, 6, 12), mat(blueKnit));
  pad.rotation.y = Math.PI / 2; pad.position.set(s * 1.56, 0, 0); head.add(pad);
}
const band = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.16, 6, 20, Math.PI), mat(blueKnit));
band.position.y = 0.05; head.add(band);
const nose = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.4, 6), mat(knit('#f2a33a')));
nose.rotation.x = Math.PI / 2; nose.position.set(0, -0.05, 1.6); head.add(nose);
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.035, 4, 12, Math.PI), new THREE.MeshStandardMaterial({ color: 0x222222 }));
mouth.rotation.z = Math.PI; mouth.position.set(0, -0.45, 1.42); head.add(mouth);
head.position.y = 1.0;
const body = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.9, 2.8, 9, 2), mat(whiteKnit));
body.position.y = -2.0;
const scarf = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.32, 6, 12), mat(flowerKnit));
scarf.rotation.x = Math.PI / 2; scarf.position.y = -0.62;
mascot.add(body, scarf, head);
scene.add(mascot);

let baseY = -1.2;
function resize() {
  const narrow = innerWidth <= 820;
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  // phones: smaller and lower, so it sits under the hero text instead of over it
  camera.position.z = narrow ? 32 : 14.5;
  camera.updateProjectionMatrix();
  baseY = narrow ? -4 : -1.2;
  mascot.position.set(narrow ? 0 : 1.6, baseY, 0);
}
addEventListener('resize', resize); resize();

const mouse = new THREE.Vector2();
addEventListener('pointermove', (e) => mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();
  // look at the cursor
  const ry = (mouse.x - mascot.position.x / 6) * 0.7, rx = -mouse.y * 0.35;
  head.rotation.y += (ry - head.rotation.y) * 0.08;
  head.rotation.x += (rx - head.rotation.x) * 0.08;
  mascot.rotation.y += (ry * 0.3 - mascot.rotation.y) * 0.04;
  // nod to the beat
  const nod = player.playing ? Math.pow(1 - player.phase, 3) * 0.12 + player.bass * 0.08 : Math.sin(t * 1.2) * 0.02;
  head.rotation.x += nod * 0.6;
  head.position.y = 1.0 - nod * 0.4;
  const sq = 1 + player.kick * 0.04;
  mascot.scale.set(sq, 2 - sq, sq);
  // scroll: mascot drifts up and away
  const sc = Math.min(1, scrollY / innerHeight);
  mascot.position.y = baseY + sc * 3.5;
  canvas.style.opacity = 1 - sc * 0.85;
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
